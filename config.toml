theme = "lynx"
title = "Mindful Miles"
baseURL = "https://bakhrululum19.github.io/"

enableEmoji = true
disableKinds = ["taxonomy", "term"]

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[permalinks]
  posts = "/posts/:slug/"

# ✅ IMPORTANT: make section pages output HTML (not RSS-only)
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[params]
  themeColor = "system"

[params.author]
  name = "Bakhrul Ulum"
  headline = "living and working with minimal gear, often on the move 🎒🚶🏻🚴🏼‍♀️ ⛴️ 🚌 ✈️ 🚆"
  # ✅ Put the image in: static/images/bu-pic.jpg
  image = "bu-pic.jpg"
  links = [
    { github = "https://github.com/bakhrululum19"},
    { linkedin = "https://linkedin.com/in/bakhrululum19" },
    { instagram = "https://instagram.com/bykefulness"},
    { strava = { href = "https://strava.app.link/RguGRgexXVb", text = "Strava", icon = "strava" } },
    { packingpanic = { href = "https://packingpanic.de", text = "Packing Panic" } },
    { travel = { href = "/posts/", text = "🇬🇧 Travel Notes", icon = "map" } },
    { travel = { href = "/id/posts/", text = "🇮🇩 Cerita Perjalanan", icon = "map" } }
  ]

[markup.highlight]
  noClasses = false

[markup.goldmark]
  [markup.goldmark.renderer]
    unsafe = true

[related]
  threshold = 1
  includeNewer = true
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "date"
    weight = 10

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en"
    contentDir = "content"
    weight = 1

  [languages.id]
    languageName = "Bahasa Indonesia"
    languageCode = "id"
    contentDir = "content/id"
    weight = 2

