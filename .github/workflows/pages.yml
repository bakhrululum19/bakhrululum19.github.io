name: Build and Deploy Hugo to Pages
on:
  push: { branches: ["main"] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: "pages", cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, submodules: true }   # pulls themes/ if you use submodule
      - uses: peaceiris/actions-hugo@v2
        with: { hugo-version: "latest", extended: true }
      - run: hugo --minify
      - uses: actions/upload-pages-artifact@v4
        with: { path: ./public }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
