{{ define "main" }}
  <article class="mx-auto mt-10 w-full max-w-3xl px-4">
    <header class="mb-12 text-center">
      <h1 class="text-4xl font-extrabold">{{ .Title }}</h1>
      {{ with .Content }}
        <div class="prose dark:prose-invert mt-6 text-left sm:text-center">
          {{ . }}
        </div>
      {{ end }}
      <div class="mt-10 border-t border-neutral-200 dark:border-neutral-800"></div>
    </header>

    <ol class="list-none divide-y divide-neutral-200 border-y border-neutral-200 dark:divide-neutral-800 dark:border-neutral-800">
      {{ range .Pages.ByDate.Reverse }}
        <li class="py-4">
          <a class="block text-lg font-semibold text-neutral-900 hover:underline dark:text-white" href="{{ .RelPermalink }}">
            {{ .Title }}
          </a>
        </li>
      {{ end }}
    </ol>
  </article>
{{ end }}
